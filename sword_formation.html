<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万剑归宗 - 赛博修仙</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: sans-serif;
        }
        #title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            pointer-events: none;
            z-index: 10;
        }
        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 2px solid #00ffff;
            border-radius: 8px;
            overflow: hidden;
            transform: scaleX(-1);
            z-index: 10;
            opacity: 0.6;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #instructions {
            position: absolute;
            top: 80px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #00ffff;
            font-size: 14px;
            z-index: 10;
        }
    </style>
    <!-- Three.js -->
    <script src="https://cloudflare.com"></script>
    <!-- MediaPipe Hands -->
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>
    <div id="title"><h1>万剑归宗 - 赛博修仙</h1></div>
    <div id="instructions">
        <b>Hand Gestures:</b><br>
        - Open Palm: Disperse Swords<br>
        - Fist Clench: Gather & Attack<br>
        - Two Hands: Vortex Rotation
    </div>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create Swords (Particles / Simple Geometries)
        const swordCount = 2000;
        const swords = [];
        const geometry = new THREE.ConeGeometry(0.1, 1.5, 4);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });

        for (let i = 0; i < swordCount; i++) {
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(
                (Math.random() - 0.5) * 50,
                (Math.random() - 0.5) * 50,
                (Math.random() - 0.5) * 50
            );
            scene.add(mesh);
            swords.push({
                mesh: mesh,
                velocity: new THREE.Vector3(),
                target: new THREE.Vector3()
            });
        }

        camera.position.z = 30;

        let handPosition = { x: 0, y: 0, mode: 'idle' };

        // MediaPipe Hands Setup
        const videoElement = document.getElementById('webcam');
        const hands = new Hands({
            locateFile: (file) => `https://jsdelivr.net{file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                // Map index finger tip or palm center
                const palm = landmarks[9];
                handPosition.x = (palm.x - 0.5) * -40;
                handPosition.y = -(palm.y - 0.5) * 30;

                // Simple gesture check: fist vs open palm
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                handPosition.mode = distance < 0.05 ? 'attack' : 'swarm';
            } else {
                handPosition.mode = 'idle';
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        cameraUtils.start();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            swords.forEach((item, index) => {
                const pos = item.mesh.position;
                if (handPosition.mode === 'attack') {
                    // Gather and thrust forward
                    const targetX = handPosition.x;
                    const targetY = handPosition.y;
                    pos.x += (targetX - pos.x) * 0.1;
                    pos.y += (targetY - pos.y) * 0.1;
                    pos.z += (0 - pos.z) * 0.1;
                } else if (handPosition.mode === 'swarm') {
                    // Swirl around hand
                    const angle = Date.now() * 0.002 + index;
                    const radius = 5 + (index % 10);
                    const targetX = handPosition.x + Math.cos(angle) * radius;
                    const targetY = handPosition.y + Math.sin(angle) * radius;
                    pos.x += (targetX - pos.x) * 0.08;
                    pos.y += (targetY - pos.y) * 0.08;
                } else {
                    // Float idle
                    pos.y += Math.sin(Date.now() * 0.001 + index) * 0.02;
                }
                item.mesh.lookAt(handPosition.x, handPosition.y, 0);
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
